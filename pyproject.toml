[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotpot-rag-agent"
version = "0.1.0"
description = "A small LangGraph RAG agent for multi-hop HotpotQA questions, evaluated with rag-eval-harness."
requires-python = ">=3.11"
# Lower bounds are the versions the results were produced with (exact pins
# live in requirements.txt).
dependencies = [
    "rag-eval-harness @ git+https://github.com/nyarvan/rag-eval-harness.git@66aaf73fdcf5a50229e1f42927ac3e2588125429",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2
    "langchain-community>=0.4.1,<0.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
